<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#493426" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Connects best operators to startup founders with new innovative solutions" />
    <title>Meet the best operators</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/connections.css" />
    <script src="/app.js" defer></script>
    <script src="/connections.js" defer></script>
  </head>
  <body>
    <main>
      <section id="landing" class="panel" aria-labelledby="landing-title">
        <h1 id="landing-title">Meet the best operators</h1>
        <p>Connects best operators to startup founders with new innovative solutions</p>
        <section id="landing-how" aria-labelledby="landing-how-title">
          <h2 id="landing-how-title">How it works</h2>
          <ol>
            <li>Ask</li>
            <li>Match</li>
            <li>Meet</li>
          </ol>
        </section>
        <button id="open-ask" class="primary" type="button">Founder, enter your requirements</button>
      </section>
      <section id="ask" class="panel" aria-labelledby="ask-title" hidden>
        <button id="back" class="back" type="button">Back to landing page</button>
        <h1 id="ask-title" tabindex="-1">Enter your pilot ask</h1>
        <p id="founder-company" hidden></p>
        <label for="pilot-ask">What would you like to pilot, and with which companies?</label>
        <textarea id="pilot-ask" rows="7" autocomplete="off" aria-describedby="matching-note" placeholder="For example: We have an AI-enabled supply chain &amp; manufacturing decision intelligence tool that identifies supply chain/production bottlenecks across industries. Looking for a 6–8 week pilot with ₹100 Cr+ companies, ideally contract manufacturers, retail or industrial products."></textarea>
        <div class="search-actions">
          <p id="matching-note" role="status">Matching opens soon</p>
          <button id="search" class="primary" type="button" disabled aria-describedby="matching-note search-message">Search</button>
        </div>
        <p id="search-message" role="status" hidden></p>
      </section>
      <section id="link-state" class="panel" aria-labelledby="link-title" hidden>
        <h1 id="link-title" tabindex="-1">Opening your personal link</h1>
        <p id="link-message" role="status">Loading your company...</p>
        <button id="retry-link" class="primary" type="button" hidden>Try again</button>
      </section>
      <section id="matches" class="panel matches-panel" aria-labelledby="matches-title" hidden>
        <a id="back-to-ask" class="back" href="?screen=ask">Back to my ask</a>
        <h1 id="matches-title" tabindex="-1">Your two best-fit operators</h1>
        <div id="match-cards"></div>
        <p id="results-message" role="status" hidden></p>
      </section>
    </main>
  </body>
</html>
