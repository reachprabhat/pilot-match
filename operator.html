<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#493426" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Requests for you</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/operator.css" />
    <script src="/operator.js" defer></script>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="requests-title" aria-busy="true">
        <h1 id="requests-title" tabindex="-1">Requests for you</h1>
        <p id="requests-message" role="status">Loading your requests...</p>
        <div id="requests-list"></div>
        <button id="requests-action" class="primary" type="button" hidden>Try again</button>
      </section>
    </main>
  </body>
</html>
